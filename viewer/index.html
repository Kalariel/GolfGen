<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Course Viewer — Parcours Minecraft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>GOLF COURSE VIEWER</h1>
  <div class="stats">
    <span>Seed: <strong id="stat-seed">—</strong></span>
    <span>Taille: <strong id="stat-size">—</strong></span>
    <span>Trous: <strong id="stat-holes">—</strong></span>
    <span>Pipeline: <strong id="stat-stages">—</strong></span>
  </div>
</div>

<div class="main-container">
  <div class="sidebar">
    <h2>CHARGER</h2>
    <div class="file-input-area">
      <label for="file-input">Choisir un JSON...</label>
      <input type="file" id="file-input" accept=".json">
      <div class="filename" id="filename">Aucun fichier</div>
    </div>

    <h2>COUCHES</h2>
    <div class="layer-toggles">
      <button id="btn-terrain" class="active" onclick="toggle('terrain')">Terrain</button>
      <button id="btn-paving" class="active" onclick="toggle('paving')">Paving</button>
      <button id="btn-routing" class="active" onclick="toggle('routing')">Routing</button>
      <button id="btn-hazards" class="active" onclick="toggle('hazards')">Obstacles</button>
      <button id="btn-vegetation" class="active" onclick="toggle('vegetation')">Arbres</button>
      <button id="btn-features" class="active" onclick="toggle('features')">Features</button>
    </div>

    <h2>AFFICHAGE</h2>
    <div class="layer-toggles">
      <button id="btn-grid" class="active" onclick="toggle('grid')">Grille</button>
      <button id="btn-nums" class="active" onclick="toggle('nums')">Numeros</button>
    </div>

    <div id="hole-tables">
      <div class="info-box">
        Charger un fichier JSON pour voir les trous.<br><br>
        <code>python pipeline.py --stage terrain</code>
      </div>
    </div>
  </div>

  <div class="map-area">
    <div class="canvas-wrapper">
      <canvas id="map"></canvas>
    </div>
    <div class="coord-display" id="coords">Survole la carte pour voir les coordonnees bloc</div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script src="viewer.js"></script>
</body>
</html>
